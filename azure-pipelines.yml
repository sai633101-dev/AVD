trigger: none # Manual trigger for testing

pool:
  vmImage: 'ubuntu-latest'

variables:
  - group: avd-test-vars # We will create this Variable Group in ADO

steps:
  - task: AzureCLI@2
    displayName: 'Terraform Init, Plan, and Apply'
    inputs:
      azureSubscription: 'YOUR_SERVICE_CONNECTION_NAME' # Update this!
      addSpnToEnvironment: true
      scriptType: 'bash'
      scriptLocation: 'inlineScript'
      inlineScript: |
        set -e
        
        # Map Azure ADO Service Connection credentials to Terraform
        export ARM_CLIENT_ID=$servicePrincipalId
        export ARM_CLIENT_SECRET=$servicePrincipalKey
        export ARM_TENANT_ID=$tenantId
        export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)

        echo "Initializing Terraform Backend..."
        terraform init \
          -backend-config="resource_group_name=$(backend_rg)" \
          -backend-config="storage_account_name=$(backend_storage)" \
          -backend-config="container_name=tfstate" \
          -backend-config="key=small-project.tfstate"

        echo "Running Terraform Apply..."
        terraform apply -auto-approve \
          -var="resource_group_name=$(resource_group_name)" \
          -var="location=$(location)" \
          -var="hostpool_name=$(hostpool_name)"
